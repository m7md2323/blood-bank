name: Build, test and push images

on: push

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run backend tests
        run: dotnet test src/Tests/UnitTests/UnitTests.csproj --configuration Release

      - name: Build backend image
        run: docker build -t blood-bank-backend .

      - name: Build Flutter image
        run: docker build --target runtime -t blood-bank-flutter ./ZaidFlutterCode

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker tag blood-bank-backend "$DOCKERHUB_USERNAME/blood-bank-backend:latest"
          docker tag blood-bank-flutter "$DOCKERHUB_USERNAME/blood-bank-flutter:latest"
          docker push "$DOCKERHUB_USERNAME/blood-bank-backend:latest"
          docker push "$DOCKERHUB_USERNAME/blood-bank-flutter:latest"
