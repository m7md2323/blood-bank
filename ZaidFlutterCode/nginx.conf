server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Flutter output uses stable filenames; revalidate after deployments.
    add_header Cache-Control "no-cache";

    # Missing assets should return 404 rather than the app's HTML.
    location ~* \.(js|mjs|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|otf|json|wasm|bin|map)$ {
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location /canvaskit/ {
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
