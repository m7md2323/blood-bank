services:
  backend:
    image: awsmalek/blood-bank-backend:latest
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5000}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: 'Host=postgres;Port=5432;Database=${POSTGRES_DB:?Set POSTGRES_DB in .env};Username=${POSTGRES_USER:?Set POSTGRES_USER in .env};Password="${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"'
      JwtSettings__Secret: ${JwtSettings__Secret:?Set JwtSettings__Secret in .env}
      JwtSettings__Issuer: ${JwtSettings__Issuer:?Set JwtSettings__Issuer in .env}
      JwtSettings__Audience: ${JwtSettings__Audience:?Set JwtSettings__Audience in .env}
      JwtSettings__ExpiryMinutes: ${JwtSettings__ExpiryMinutes:-60}

    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  flutter:
    image: awsmalek/blood-bank-flutter:latest
    container_name: bloodbank_flutter_web
    ports:
      - "127.0.0.1:${FLUTTER_PORT:-8080}:80"
    restart: unless-stopped

  postgres:
    image: postgis/postgis:17-3.5
    container_name: bloodbank_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
