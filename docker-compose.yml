services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  flutter:
    build:
      context: ./ZaidFlutterCode
      dockerfile: Dockerfile
      target: runtime
    container_name: bloodbank_flutter_web
    ports:
      - "8080:80"
    restart: unless-stopped

  postgres:
    image: postgis/postgis:17-3.5
    container_name: bloodbank_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_blood_bank
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_blood_bank"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
